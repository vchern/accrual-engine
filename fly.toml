# Fly.io app config. Run `fly launch --copy-config --no-deploy` to claim
# this app name (it must be globally unique on Fly — change it below if
# already taken). Then `fly volumes create lambda_data --size 1 --region iad`
# and `fly secrets set GEMINI_API_KEY=...` before `fly deploy`.

app = "accrual-engine"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  PORT = "9292"
  DATABASE_PATH = "/data/production.sqlite3"

[[mounts]]
  source = "lambda_data"
  destination = "/data"

[http_service]
  internal_port = 9292
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
